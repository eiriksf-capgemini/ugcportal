name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

jobs:
  guard-sensitive-files:
    name: Guard sensitive settings files
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail if .claude/settings*.json or CLAUDE.md is bundled with other changes
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          CHANGED=$(git diff --name-only "origin/${BASE_REF}...HEAD")
          echo "Changed files:"
          echo "$CHANGED"
          if echo "$CHANGED" | grep -Ex '(\.claude/settings(\.local)?\.json|CLAUDE\.md)'; then
            echo "::error::This PR touches .claude/settings.json, .claude/settings.local.json, or CLAUDE.md. Per CLAUDE.md policy, changes to these files must go through a dedicated PR for human review and must never be bundled with unrelated work. Split this change out."
            exit 1
          fi

  guard-version-consistency:
    name: Guard package.json/package-lock.json version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check version fields match
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json'));
            const lock = JSON.parse(fs.readFileSync('package-lock.json'));
            const pv = pkg.version;
            const ltv = lock.version;
            const lrv = lock.packages[''].version;
            const mismatches = [];
            if (pv !== ltv) mismatches.push('package.json (' + pv + ') !== package-lock.json top-level (' + ltv + ')');
            if (pv !== lrv) mismatches.push('package.json (' + pv + ') !== package-lock.json packages[\"\"] (' + lrv + ')');
            if (ltv !== lrv) mismatches.push('package-lock.json top-level (' + ltv + ') !== packages[\"\"] (' + lrv + ')');
            if (mismatches.length > 0) {
              console.error('::error::Version mismatch detected:');
              mismatches.forEach(m => console.error('  - ' + m));
              console.error('All three version fields must be identical:');
              console.error('  package.json version: ' + pv);
              console.error('  package-lock.json top-level version: ' + ltv);
              console.error('  package-lock.json packages[\"\"].version: ' + lrv);
              process.exit(1);
            }
            console.log('✓ Version fields match: ' + pv);
          "

  guard-conventional-commit-title:
    name: Guard conventional-commit PR title
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Check PR title follows Conventional Commits
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "PR title: $PR_TITLE"
          PATTERN='^chore\(release\): v[0-9]+\.[0-9]+\.[0-9]+$|^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)\([a-z0-9-]+\)!?: .+ \([a-zA-Z0-9]+-[a-zA-Z0-9]+\)$'
          if ! echo "$PR_TITLE" | grep -qE "$PATTERN"; then
            echo "::error::PR title must follow Conventional Commits: <type>(<scope>): <description> (<bead-id>), e.g. 'feat(gallery): add lightbox (ugcportal-71y)'. Scope and the trailing bead-id are both required (the only exception is a release commit: 'chore(release): vX.Y.Z'). Valid types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert. See CLAUDE.md > 'Conventional Commits & Release Notes'."
            exit 1
          fi

  quality:
    name: Lint, test, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          AUTH_SECRET: ci-placeholder-secret-not-for-real-use
          AUTH_GOOGLE_ID: ci-placeholder
          AUTH_GOOGLE_SECRET: ci-placeholder
          AUTH_FACEBOOK_ID: ci-placeholder
          AUTH_FACEBOOK_SECRET: ci-placeholder

      - name: Typecheck
        run: npm run typecheck
