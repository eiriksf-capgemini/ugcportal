name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

# One run per PR at a time: a newer push cancels the run it supersedes.
# Pushes to main are never cancelled, so every merge commit is verified
# (ugcportal-ugcportal-0an4).
concurrency:
  # Edited events (title or body) skip the quality job, so they must not
  # share a group with code events: otherwise a body edit right after a push
  # cancels the run that carries the head's only quality result
  # (ugcportal-ugcportal-sxwb).
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event.action == 'edited' && 'edited' || 'code' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  guards:
    name: Guards (sensitive files, version consistency, PR title, harness self-test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail if .claude/settings*.json or CLAUDE.md is bundled with other changes
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          CHANGED_FILES=$(git diff --name-only "origin/${BASE_REF}...HEAD")
          export CHANGED_FILES
          node scripts/check-sensitive-files.mjs

      - name: Check version fields match
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json'));
            const lock = JSON.parse(fs.readFileSync('package-lock.json'));
            const pv = pkg.version;
            const ltv = lock.version;
            const lrv = lock.packages[''].version;
            const mismatches = [];
            if (pv !== ltv) mismatches.push('package.json (' + pv + ') !== package-lock.json top-level (' + ltv + ')');
            if (pv !== lrv) mismatches.push('package.json (' + pv + ') !== package-lock.json packages[\"\"] (' + lrv + ')');
            if (ltv !== lrv) mismatches.push('package-lock.json top-level (' + ltv + ') !== packages[\"\"] (' + lrv + ')');
            if (mismatches.length > 0) {
              console.error('::error::Version mismatch detected:');
              mismatches.forEach(m => console.error('  - ' + m));
              console.error('All three version fields must be identical:');
              console.error('  package.json version: ' + pv);
              console.error('  package-lock.json top-level version: ' + ltv);
              console.error('  package-lock.json packages[\"\"].version: ' + lrv);
              process.exit(1);
            }
            console.log('✓ Version fields match: ' + pv);
          "

      - name: Check PR title follows Conventional Commits
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/check-pr-title.mjs

      - name: Check whether harness-cost-controls scripts changed
        id: changed
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            CHANGED=$(git diff --name-only "origin/${BASE_REF}...HEAD")
          elif [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$PUSH_BEFORE" 2>/dev/null; then
            # Diff the whole pushed range, not just the last commit -- a
            # multi-commit direct push to main would otherwise only check
            # its final commit and could silently skip a scripts/ change
            # made earlier in the same push.
            CHANGED=$(git diff --name-only "$PUSH_BEFORE" HEAD)
          else
            # No usable "before" SHA (first push to the branch, a force-push,
            # or history rewrite) -- fail safe and assume relevant, rather
            # than silently skipping the self-test on an unknown range.
            CHANGED=".claude/skills/harness-cost-controls/scripts/"
          fi
          echo "Changed files:"
          echo "$CHANGED"
          if echo "$CHANGED" | grep -q '^\.claude/skills/harness-cost-controls/scripts/'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run usage_indicators.py self-test
        if: steps.changed.outputs.run == 'true'
        working-directory: .claude/skills/harness-cost-controls/scripts
        run: python3 -m unittest test_usage_indicators -v

  quality:
    name: Lint, test, typecheck, build
    runs-on: ubuntu-latest
    # A PR title or body edit changes nothing the suite can see; the guards
    # job still runs on it so the title guard keeps working (ugcportal-ugcportal-0an4).
    if: github.event_name == 'push' || github.event.action != 'edited'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check prisma/schema.prisma matches prisma/migrations
        run: npx prisma migrate diff --from-migrations prisma/migrations --to-schema prisma/schema.prisma --exit-code

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Load placeholder auth env vars from scripts/ci-placeholder-env.sh
        run: |
          . ./scripts/ci-placeholder-env.sh
          {
            echo "AUTH_SECRET=$AUTH_SECRET_PLACEHOLDER"
            echo "AUTH_GOOGLE_ID=$AUTH_GOOGLE_ID_PLACEHOLDER"
            echo "AUTH_GOOGLE_SECRET=$AUTH_GOOGLE_SECRET_PLACEHOLDER"
            echo "AUTH_FACEBOOK_ID=$AUTH_FACEBOOK_ID_PLACEHOLDER"
            echo "AUTH_FACEBOOK_SECRET=$AUTH_FACEBOOK_SECRET_PLACEHOLDER"
          } >> "$GITHUB_ENV"

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck
